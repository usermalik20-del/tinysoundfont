name: TinySoundFont hardening checks

on:
  push:
    branches:
      - main
      - claude/hardening
      - fix/ubsan-stream-casts
      - fix/tml-message-array-overflow
  pull_request:
  workflow_dispatch:

env:
  # pinned stb_vorbis revision used by the SF3 / Ogg Vorbis lane
  STB_VORBIS_URL: https://raw.githubusercontent.com/nothings/stb/d14d46f6b44456eb88beac58cba833a4135d4c89/stb_vorbis.c

jobs:
  sanitizers:
    name: ASan + UBSan test suite (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: gcc --version | head -1
      - name: Run hardening test suite
        run: bash tests/run-tests.sh

  sanitizers-clang:
    name: ASan + UBSan test suite (clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Show toolchain
        run: clang --version | head -1
      - name: Run hardening test suite with clang
        run: CC=clang bash tests/run-tests.sh

  sanitizers-sf3:
    name: ASan + UBSan test suite (gcc, SF3 / Ogg path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned stb_vorbis
        run: curl -fsSL -o /tmp/stb_vorbis.c "$STB_VORBIS_URL" && head -2 /tmp/stb_vorbis.c
      - name: Run hardening test suite with the SF3 path compiled in
        run: STBVORBIS=/tmp/stb_vorbis.c bash tests/run-tests.sh

  runtime-32bit:
    name: 32-bit runtime test suite (x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit compiler and sanitizer runtime
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Show 32-bit toolchain
        run: gcc --version | head -1 && gcc -m32 -dM -E - < /dev/null | grep __SIZEOF_POINTER__
      - name: Run hardening test suite as 32-bit binaries
        run: CC="gcc -m32" bash tests/run-tests.sh

  armv7-compile:
    name: ARMv7 / armeabi-v7a compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARMv7 cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
      - name: Compile all header implementations for ARMv7
        run: |
          set -e
          for source in tests/regress.c tests/fuzz.c tests/oom.c tests/steal.c tests/tmlfuzz.c tests/tmloom.c; do
            output="/tmp/$(basename "$source" .c).armv7.o"
            arm-linux-gnueabihf-gcc -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard -O2 -I. -c "$source" -o "$output"
          done
          file /tmp/*.armv7.o
