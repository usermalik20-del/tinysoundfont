name: TinySoundFont hardening checks

on:
  push:
    branches:
      - main
      - claude/hardening
      - fix/ubsan-stream-casts
      - fix/tml-message-array-overflow
      - quality/*
  pull_request:
  workflow_dispatch:

env:
  # pinned stb_vorbis revision used by the SF3 / Ogg Vorbis lane
  STB_VORBIS_URL: https://raw.githubusercontent.com/nothings/stb/d14d46f6b44456eb88beac58cba833a4135d4c89/stb_vorbis.c

jobs:
  sanitizers:
    name: ASan + UBSan test suite (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: gcc --version | head -1
      - name: Run hardening test suite
        run: bash tests/run-tests.sh

  sanitizers-clang:
    name: ASan + UBSan test suite (clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Show toolchain
        run: clang --version | head -1
      - name: Run hardening test suite with clang
        run: CC=clang bash tests/run-tests.sh

  sanitizers-sf3:
    name: ASan + UBSan test suite (gcc, SF3 / Ogg path + fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned stb_vorbis
        run: curl -fsSL -o /tmp/stb_vorbis.c "$STB_VORBIS_URL" && head -2 /tmp/stb_vorbis.c
      - name: Run hardening test suite with the SF3 path compiled in
        env:
          TSF_BASELINE_SUFFIX: -stbvorbis
        run: STBVORBIS=/tmp/stb_vorbis.c bash tests/run-tests.sh

  runtime-32bit:
    name: 32-bit runtime test suite (x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit compiler and sanitizer runtime
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Show 32-bit toolchain
        run: gcc --version | head -1 && gcc -m32 -dM -E - < /dev/null | grep __SIZEOF_POINTER__
      - name: Run hardening test suite as 32-bit binaries
        env:
          TSF_BASELINE_SUFFIX: -m32
        run: CC="gcc -m32" bash tests/run-tests.sh

  runtime-armv7:
    name: ARMv7 / armeabi-v7a compile and qemu run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARMv7 cross compiler and qemu
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user
      - name: Compile every test program for ARMv7
        run: |
          set -e
          for source in tests/regress.c tests/fuzz.c tests/oom.c tests/steal.c tests/tmlfuzz.c tests/tmloom.c tests/mod.c tests/fx.c tests/realtime.c; do
            output="/tmp/$(basename "$source" .c).armv7.o"
            arm-linux-gnueabihf-gcc -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard -static -O2 -I. -c "$source" -o "$output"
          done
          file /tmp/*.armv7.o | head -3
      - name: Run the ARMv7 regression under qemu and compare the audio hash
        run: |
          set -e
          arm-linux-gnueabihf-gcc -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard -static -O2 -I. -o /tmp/tsf_regress.armv7 tests/regress.c -lm
          HASH=$(qemu-arm /tmp/tsf_regress.armv7 examples/florestan-subset.sf2 | sed -n 's/.*hash: \([0-9a-f]*\).*/\1/p')
          echo "armv7 audio hash: $HASH"
          if [ -f tests/baselines/armv7-gcc-O2.txt ]; then
            [ "$HASH" = "$(cat tests/baselines/armv7-gcc-O2.txt)" ] || { echo "armv7 hash differs from the pinned baseline"; exit 1; }
            echo "armv7 hash matches tests/baselines/armv7-gcc-O2.txt"
          fi

  runtime-arm64:
    name: ARM64 runtime test suite (native runner)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: uname -m && gcc --version | head -1
      - name: Run hardening test suite on AArch64
        run: bash tests/run-tests.sh

  baseline-record:
    name: Record audio hash baselines (informational)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print the hashes the pinned baselines should contain
        run: |
          set -e
          gcc -O2 -I. -o /tmp/regress tests/regress.c -lm
          echo "x86_64-gcc-O2: $(/tmp/regress examples/florestan-subset.sf2 | sed -n 's/.*hash: \([0-9a-f]*\).*/\1/p')"
          clang --version >/dev/null 2>&1 || sudo apt-get install -y clang >/dev/null
          clang -O2 -I. -o /tmp/regress.clang tests/regress.c -lm
          echo "x86_64-clang-O2: $(/tmp/regress.clang examples/florestan-subset.sf2 | sed -n 's/.*hash: \([0-9a-f]*\).*/\1/p')"
